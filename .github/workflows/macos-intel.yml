name: Intel macOS x86-64 application package
'on':
  workflow_dispatch: null
  push:
    branches:
    - macos-intel-beta-20261117
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: PortMidi/portmidi
        ref: 8341a6713842d2374c3aad8998d43b20ad0db435
        path: build/portmidi
        fetch-depth: 1
    - uses: actions/checkout@v4
      with:
        repository: tonioni/WinUAE
        ref: d82bc2549f27943d11dc59482d5388daf1c0f337
        path: build/winuae
    - name: Require native Intel Mac
      run: |
        test '${{ runner.arch }}' = X64
        test "$(uname -m)" = x86_64
        sw_vers
    - name: Native build and networking dependencies
      run: |
        brew install cmake autoconf automake libtool pkg-config sdl2 jpeg-turbo libslirp
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libslirp)/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib -Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
    - name: Build exact modern040 CPU and SoftFloat source
      run: |
        python3 tools/build-modern040-library.py --output "$RUNNER_TEMP/modern040-intel" --upstream build/winuae --cxx clang++
    - name: Build pinned PortMidi native device support
      run: |
        if test "${RUNNER_OS:-Linux}" = macOS; then
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi" --macos-min-version "${MACOSX_DEPLOYMENT_TARGET:-15.0}" --macos-architecture "$(uname -m)"
        else
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi"
        fi
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/portmidi/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/portmidi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Build connected Intel integer and FPU JIT application
      run: |
        NO_CONFIGURE=1 ./autogen.sh
        mkdir -p build/macos-intel
        cd build/macos-intel
        ../../configure --enable-portmidi --disable-opengl --enable-sdl2 --enable-jit-compiler --enable-jit-fpu --enable-addressing=normal --enable-modern040-core --with-modern040-profile=aranym-modern040-macos --with-modern040-library="$RUNNER_TEMP/modern040-intel/libmodern040.a" --enable-slirp --enable-nfjpeg --enable-disasm=builtin --disable-flightrecorder --disable-fullhistory CFLAGS=-O3 CXXFLAGS=-O3
        grep -q -- '-DCPU_x86_64' Makefile
        grep -q -- '-DMODERN040_FPU_JIT' Makefile
        make -j3
        lipo src/aranym -verify_arch x86_64
        otool -hv src/aranym
    - name: Package Intel app, exact source and dependencies
      run: |
        mkdir -p build/emutos
        curl -L --fail --retry 3 -o build/emutos/source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
        python3 tools/package-macos.py --portmidi-prefix "$RUNNER_TEMP/portmidi" --architecture x86_64 --x64-fpu-jit-test --binary build/macos-intel/src/aranym --jit-build-dir build/macos-intel --output build/macos-intel-package --emutos-source-archive build/emutos/source.tar.gz
        git archive --format=tar.gz -o build/macos-intel-package/aranym-source.tar.gz HEAD
        git -C build/winuae archive --format=tar.gz --prefix=winuae-d82bc254/ -o "$GITHUB_WORKSPACE/build/macos-intel-package/winuae-source.tar.gz" HEAD
        cp "$RUNNER_TEMP/modern040-intel/provenance.json" build/macos-intel-package/modern040-build.json
    - name: Verify relocated package and runtime dependencies
      run: |
        python3 tools/check-macos-package.py build/macos-intel-package/ARAnyM-Unofficial.app
    - name: Archive application without a personal drive image
      run: |
        tar -czf aranym-1.2.0-unofficial-fpu-jit-test2-macos-x86_64.tar.gz -C build/macos-intel-package .
        shasum -a 256 aranym-1.2.0-unofficial-fpu-jit-test2-macos-x86_64.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: aranym-macos-x86_64-${{ github.sha }}
        path: aranym-1.2.0-unofficial-fpu-jit-test2-macos-x86_64.tar.gz
    - name: Retain Intel build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: macos-x86_64-diagnostics-${{ github.sha }}
        path: |
          build/macos-intel/config.log
          build/macos-intel-package/*.json
          build/macos-intel-package/*.txt
