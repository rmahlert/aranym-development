name: Intel macOS x86-64 testing package

on:
  workflow_dispatch:
  push:
    branches: [macos-intel-beta-20261117]

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: tonioni/WinUAE
          ref: d82bc2549f27943d11dc59482d5388daf1c0f337
          path: build/winuae
      - name: Require native Intel Mac
        run: |
          test '${{ runner.arch }}' = X64
          test "$(uname -m)" = x86_64
          sw_vers
      - name: Native build and networking dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 jpeg-turbo libslirp
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libslirp)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib -Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
      - name: Build exact modern040 CPU and SoftFloat source
        run: python3 tools/build-modern040-library.py --output "$RUNNER_TEMP/modern040-intel" --upstream build/winuae --cxx clang++
      - name: Build connected Intel integer and FPU JIT application
        run: |
          NO_CONFIGURE=1 ./autogen.sh
          mkdir -p build/macos-intel
          cd build/macos-intel
          ../../configure --disable-opengl --enable-sdl2 --enable-jit-compiler --enable-jit-fpu --enable-addressing=normal --enable-modern040-core --with-modern040-profile=aranym-modern040-macos --with-modern040-library="$RUNNER_TEMP/modern040-intel/libmodern040.a" --enable-slirp --enable-nfjpeg --enable-disasm=builtin --disable-flightrecorder --disable-fullhistory CFLAGS=-O3 CXXFLAGS=-O3
          grep -q -- '-DCPU_x86_64' Makefile
          grep -q -- '-DMODERN040_FPU_JIT' Makefile
          make -j3
          lipo src/aranym -verify_arch x86_64
          otool -hv src/aranym
      - name: Package Intel app, exact source and dependencies
        run: |
          mkdir -p build/emutos
          curl -L --fail --retry 3 -o build/emutos/source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
          python3 tools/package-macos.py --architecture x86_64 --x64-fpu-jit-test --binary build/macos-intel/src/aranym --jit-build-dir build/macos-intel --output build/macos-intel-package --emutos-source-archive build/emutos/source.tar.gz
          git archive --format=tar.gz -o build/macos-intel-package/aranym-source.tar.gz HEAD
          git -C build/winuae archive --format=tar.gz --prefix=winuae-d82bc254/ -o "$GITHUB_WORKSPACE/build/macos-intel-package/winuae-source.tar.gz" HEAD
          cp "$RUNNER_TEMP/modern040-intel/provenance.json" build/macos-intel-package/modern040-build.json
      - name: Verify relocated package and Cocoa guest boot
        run: |
          python3 tools/check-macos-package.py build/macos-intel-package/ARAnyM-Unofficial.app
          python3 tests/macos-boot/run.py --app build/macos-intel-package/ARAnyM-Unofficial.app --output build/macos-intel-package/boot-validation
      - name: Exact FPU, CPU and hardware-fault recovery gates
        run: |
          python3 tests/fpu-jit/run.py --emulator build/macos-intel-package/ARAnyM-Unofficial.app/Contents/MacOS/aranym --firmware build/macos-intel-package/ARAnyM-Unofficial.app/Contents/Resources/emutos-aranym.img --output build/macos-intel-package/fpu-validation --cpu-regression
          python3 tests/jit-hardware-probe/run.py --emulator build/macos-intel-package/ARAnyM-Unofficial.app/Contents/MacOS/aranym --firmware build/macos-intel-package/ARAnyM-Unofficial.app/Contents/Resources/emutos-aranym.img --output build/macos-intel-package/hardware-validation --strict-frame
      - name: Native integer JIT and SLIRP on default and custom subnets
        run: python3 tests/macos-slirp/run.py --app build/macos-intel-package/ARAnyM-Unofficial.app --architecture x86_64 --require-jit --fpu-jit --output build/macos-intel-package/network-validation
      - name: Archive qualified application without a personal drive image
        run: |
          tar -czf aranym-1.2.0-unofficial-fpu-jit-test1-macos-x86_64.tar.gz -C build/macos-intel-package .
          shasum -a 256 aranym-1.2.0-unofficial-fpu-jit-test1-macos-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aranym-macos-x86_64-${{ github.sha }}
          path: aranym-1.2.0-unofficial-fpu-jit-test1-macos-x86_64.tar.gz
      - name: Retain Intel build and qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-x86_64-diagnostics-${{ github.sha }}
          path: |
            build/macos-intel/config.log
            build/macos-intel-package/*.json
            build/macos-intel-package/*.txt
            build/macos-intel-package/*-validation
