name: ARM64 guest JIT integration

on:
  workflow_dispatch:
  push:
    branches: [arm-jit-integration-20261115]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require native ARM64
        run: |
          test '${{ runner.arch }}' = ARM64
          uname -a
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake build-essential python3 pkg-config libsdl2-dev libjpeg-dev libudev-dev libusb-1.0-0-dev
      - name: Mac dependencies
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config sdl2 jpeg-turbo libslirp
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libslirp)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib -Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
          echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Configure actual guest JIT
        run: |
          NO_CONFIGURE=1 ./autogen.sh
          mkdir -p build/arm-jit
          cd build/arm-jit
          network=--disable-slirp
          if test '${{ runner.os }}' = macOS; then network=--enable-slirp; fi
          ../../configure --disable-opengl --enable-jit-compiler --enable-arm64-jit --disable-jit-fpu --disable-cxx-exceptions --enable-addressing=normal "$network"
          grep -q -- '-DARANYM_ARM64' Makefile
          grep -q -- '-DUSE_JIT=1' Makefile
          make -j3
      - name: Package real Mac JIT app with entitlement
        if: runner.os == 'macOS'
        run: |
          mkdir -p build/emutos
          curl -L --fail --retry 3 -o build/emutos/source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
          python3 tools/package-macos.py --binary build/arm-jit/src/aranym --jit-build-dir build/arm-jit --output build/arm-jit-package --emutos-source-archive build/emutos/source.tar.gz
          python3 tools/check-macos-package.py build/arm-jit-package/ARAnyM-Unofficial.app
      - name: Native Linux guest correctness and execution witnesses
        if: runner.os == 'Linux'
        run: python3 tests/arm64-guest/run.py --emulator build/arm-jit/src/aranym --firmware data/emutos-macos-reference.img --output build/arm-jit-results
      - name: Native Mac guest correctness and execution witnesses
        if: runner.os == 'macOS'
        run: python3 tests/arm64-guest/run.py --app build/arm-jit-package/ARAnyM-Unofficial.app --output build/arm-jit-results
      - name: Native Mac guest JIT with SLIRP
        if: runner.os == 'macOS'
        run: python3 tests/macos-slirp/run.py --app build/arm-jit-package/ARAnyM-Unofficial.app --require-jit --output build/arm-jit-network
      - name: Retain integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-guest-jit-${{ runner.os }}-${{ github.sha }}
          path: |
            build/arm-jit/config.log
            build/arm-jit-results
            build/arm-jit-network
            build/arm-jit-package/*.json
            build/arm-jit-package/*.txt
