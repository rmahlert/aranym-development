name: Linux x86-64 unofficial beta
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    - macos-arm64-beta-20261115
  pull_request: null
permissions:
  contents: read
jobs:
  linux:
    name: Ubuntu 24.04 x86-64 modern040 JIT and SLIRP
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: tonioni/WinUAE
        ref: d82bc2549f27943d11dc59482d5388daf1c0f337
        path: build/winuae
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake build-essential clang python3 meson ninja-build pkg-config libsdl2-dev libjpeg-dev libglib2.0-dev libudev-dev libusb-1.0-0-dev dpkg-dev
    - name: Build pinned SLIRP runtime
      run: |
        mkdir -p build/dependency-source
        curl -L --fail --retry 3 -o build/dependency-source/libslirp-v4.9.1.tar.bz2 https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.bz2
        echo '3caff6e2de445f4995629d4929c55419f661b2b1d14f12481e155a71c1e8f811  build/dependency-source/libslirp-v4.9.1.tar.bz2' | sha256sum -c -
        tar -xjf build/dependency-source/libslirp-v4.9.1.tar.bz2 -C build
        meson setup build/slirp-build build/libslirp-v4.9.1 --prefix="$RUNNER_TEMP/slirp" --libdir=lib --buildtype=release
        ninja -C build/slirp-build
        ninja -C build/slirp-build install
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/slirp/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/slirp/lib" >> "$GITHUB_ENV"
    - name: Build pinned modern040 library
      run: |
        python3 tools/build-modern040-library.py --output "$RUNNER_TEMP/modern040" --upstream build/winuae --cxx clang++
    - name: Configure and build application
      run: |
        NO_CONFIGURE=1 ./autogen.sh
        mkdir -p build/linux
        cd build/linux
        ../../configure --prefix=/usr --datadir=/usr/share/aranym-unofficial --disable-opengl --enable-jit-compiler --disable-jit-fpu --enable-addressing=normal --enable-modern040-core --with-modern040-profile=aranym-modern040-beta1 --with-modern040-library="$RUNNER_TEMP/modern040/libmodern040.a" --enable-slirp --enable-nfjpeg --enable-disasm=builtin --disable-flightrecorder --disable-fullhistory CFLAGS='-O3 -fno-pie' CXXFLAGS='-O3 -fno-pie' LDFLAGS='-no-pie -Wl,-rpath,/usr/lib/aranym-unofficial'
        make -j3
    - name: Prepare exact dependency sources
      run: |
        curl -L --fail --retry 3 -o build/dependency-source/emutos-source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
        git -C build/winuae archive --format=tar.gz --prefix=winuae-d82bc254/ -o "$GITHUB_WORKSPACE/build/dependency-source/winuae-source.tar.gz" HEAD
    - name: Build application-only Debian package
      run: |
        python3 tools/package-linux.py --build-dir build/linux --slirp-library "$RUNNER_TEMP/slirp/lib/libslirp.so.0" --slirp-source-archive build/dependency-source/libslirp-v4.9.1.tar.bz2 --emutos-source-archive build/dependency-source/emutos-source.tar.gz --winuae-source-archive build/dependency-source/winuae-source.tar.gz --output build/linux-package
    - name: Install packaged application and inspect runtime dependencies
      run: |
        sudo apt-get install -y ./build/linux-package/aranym-1.2.0-unofficial-beta1-linux-amd64.deb
        env -u LD_LIBRARY_PATH ldd /usr/bin/aranym-unofficial
    - name: Retain build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: linux-x86_64-diagnostics-${{ github.sha }}
        path: |
          build/linux/config.log
          build/linux-package/build-manifest.json
    - name: Archive package and corresponding source
      run: |
        tar -czf aranym-1.2.0-unofficial-beta1-linux-x86_64.tar.gz -C build/linux-package --exclude=deb-root --exclude=debian .
        sha256sum aranym-1.2.0-unofficial-beta1-linux-x86_64.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: aranym-unofficial-linux-x86_64-${{ github.sha }}
        path: aranym-1.2.0-unofficial-beta1-linux-x86_64.tar.gz
