name: ARAnyM 1.2.0 Unofficial Beta 2 – Mac ARM64 and Raspberry Pi ARM64
'on':
  workflow_dispatch:
  push:
    branches:
    - arm-fpu-jit-20261116
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner:
        - ubuntu-24.04-arm
        - macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: PortMidi/portmidi
        ref: 8341a6713842d2374c3aad8998d43b20ad0db435
        path: build/portmidi
        fetch-depth: 1
    - name: Require native ARM64
      run: |
        test '${{ runner.arch }}' = ARM64
        uname -a
    - name: Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y bzip2 cmake libasound2-dev autoconf automake build-essential python3 pkg-config libsdl2-dev libjpeg-dev libudev-dev libusb-1.0-0-dev
    - uses: actions/setup-python@v5
      if: runner.os == 'macOS'
      with:
        python-version: '3.12'
    - name: Mac dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake autoconf automake libtool pkg-config sdl2 jpeg-turbo libslirp
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig:$(brew --prefix libslirp)/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"
        echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib -Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
        echo 'MACOSX_DEPLOYMENT_TARGET=15.0' >> "$GITHUB_ENV"
    - name: Build pinned PortMidi native device support
      run: |
        if test "${RUNNER_OS:-Linux}" = macOS; then
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi" --macos-min-version "${MACOSX_DEPLOYMENT_TARGET:-15.0}" --macos-architecture "$(uname -m)"
        else
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi"
        fi
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/portmidi/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/portmidi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Configure actual guest JIT
      run: |
        NO_CONFIGURE=1 ./autogen.sh
        mkdir -p build/arm-jit
        cd build/arm-jit
        network=--disable-slirp
        if test '${{ runner.os }}' = macOS; then network=--enable-slirp; fi
        ../../configure --enable-portmidi --disable-opengl --enable-sdl2 --enable-jit-compiler --enable-arm64-jit --enable-jit-fpu --disable-cxx-exceptions --enable-addressing=normal "$network"
        grep -q -- '-DARANYM_ARM64' Makefile
        grep -q -- '-DUSE_JIT=1' Makefile
        make -j3
    - name: Package real Mac JIT app with entitlement
      if: runner.os == 'macOS'
      run: |
        mkdir -p build/emutos
        curl -L --fail --retry 3 -o build/emutos/source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
        python3 tools/package-macos.py --portmidi-prefix "$RUNNER_TEMP/portmidi" --arm-fpu-jit --binary build/arm-jit/src/aranym --jit-build-dir build/arm-jit --output build/arm-jit-package --emutos-source-archive build/emutos/source.tar.gz
        python3 tools/check-macos-package.py build/arm-jit-package/ARAnyM-Unofficial.app --runtime --diagnostics build/arm-jit-package-checks
    - name: Archive Mac JIT app and corresponding source
      if: runner.os == 'macOS'
      run: |
        git archive --format=tar.gz -o build/arm-jit-package/aranym-source.tar.gz HEAD
        tar -czf aranym-1.2.0-unofficial-beta2-macos-arm64.tar.gz -C build/arm-jit-package .
        shasum -a 256 aranym-1.2.0-unofficial-beta2-macos-arm64.tar.gz
    - uses: actions/upload-artifact@v4
      if: runner.os == 'macOS'
      with:
        name: aranym-macos-arm64-guest-jit-${{ github.sha }}
        path: aranym-1.2.0-unofficial-beta2-macos-arm64.tar.gz
    - name: Retain integration diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: arm64-guest-jit-${{ runner.os }}-${{ github.sha }}
        path: |
          build/arm-jit/config.log
          build/arm-jit-package/*.json
          build/arm-jit-package-checks/
  rpi64:
    name: Raspberry Pi ARM64 Debian Bookworm application package
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 35
    steps:
    - name: Bootstrap Git for a complete source checkout
      run: |
        apt-get update
        apt-get install -y git ca-certificates
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: PortMidi/portmidi
        ref: 8341a6713842d2374c3aad8998d43b20ad0db435
        path: build/portmidi
        fetch-depth: 1
    - name: Native ARM64 userspace and dependencies
      run: |
        test "$(dpkg --print-architecture)" = arm64
        test '${{ runner.arch }}' = ARM64
        apt-get update
        apt-get install -y bzip2 cmake libasound2-dev ca-certificates curl git autoconf automake build-essential python3 pkg-config libsdl2-dev libjpeg-dev libudev-dev libusb-1.0-0-dev libglib2.0-dev meson ninja-build dpkg-dev
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Build pinned SLIRP for Bookworm
      run: |
        mkdir -p build/dependency-source
        curl -L --fail --retry 3 -o build/dependency-source/libslirp-v4.9.1.tar.bz2 https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.bz2
        echo '3caff6e2de445f4995629d4929c55419f661b2b1d14f12481e155a71c1e8f811  build/dependency-source/libslirp-v4.9.1.tar.bz2' | sha256sum -c -
        tar -xjf build/dependency-source/libslirp-v4.9.1.tar.bz2 -C build
        meson setup build/slirp-build build/libslirp-v4.9.1 --prefix="$RUNNER_TEMP/slirp" --libdir=lib --buildtype=release
        ninja -C build/slirp-build
        ninja -C build/slirp-build install
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/slirp/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/slirp/lib" >> "$GITHUB_ENV"
    - name: Build pinned PortMidi native device support
      run: |
        if test "${RUNNER_OS:-Linux}" = macOS; then
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi" --macos-min-version "${MACOSX_DEPLOYMENT_TARGET:-15.0}" --macos-architecture "$(uname -m)"
        else
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi"
        fi
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/portmidi/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/portmidi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Build ARM64 JIT application for Raspberry Pi OS Bookworm
      run: |
        NO_CONFIGURE=1 ./autogen.sh
        mkdir -p build/rpi64
        cd build/rpi64
        ../../configure --enable-portmidi --prefix=/usr --datadir=/usr/share/aranym-unofficial --disable-opengl --enable-sdl2 --enable-jit-compiler --enable-arm64-jit --enable-jit-fpu --disable-cxx-exceptions --enable-addressing=normal --enable-slirp LDFLAGS=-Wl,-rpath,/usr/lib/aranym-unofficial
        make -j3
    - name: Prepare exact firmware source and application package
      run: |
        curl -L --fail --retry 3 -o build/dependency-source/emutos-source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
        python3 tools/package-linux.py --portmidi-prefix "$RUNNER_TEMP/portmidi" --arm-fpu-jit --architecture arm64 --build-dir build/rpi64 --slirp-library "$RUNNER_TEMP/slirp/lib/libslirp.so.0" --slirp-source-archive build/dependency-source/libslirp-v4.9.1.tar.bz2 --emutos-source-archive build/dependency-source/emutos-source.tar.gz --output build/rpi64-package
    - name: Install packaged application and inspect runtime dependencies
      run: |
        apt-get install -y ./build/rpi64-package/aranym-1.2.0-unofficial-beta2-rpi-arm64.deb
        python3 tools/check-macos-package.py --installed-linux --runtime --diagnostics build/rpi64-package-checks
    - name: Archive Pi package and corresponding source
      run: |
        tar -czf aranym-1.2.0-unofficial-beta2-rpi-arm64.tar.gz -C build/rpi64-package --exclude=deb-root --exclude=debian .
        sha256sum aranym-1.2.0-unofficial-beta2-rpi-arm64.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: aranym-rpi-arm64-guest-jit-${{ github.sha }}
        path: |
          aranym-1.2.0-unofficial-beta2-rpi-arm64.tar.gz
          build/rpi64-package/aranym-1.2.0-unofficial-beta2-rpi-arm64.deb
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rpi64-guest-jit-diagnostics-${{ github.sha }}
        path: |
          build/rpi64/config.log
          build/rpi64-package/build-manifest.json
          build/rpi64-package-checks/
