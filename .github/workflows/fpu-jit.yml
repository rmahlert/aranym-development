name: ARAnyM 1.2.0 Unofficial Beta 2 – Linux x86-64
'on':
  workflow_dispatch:
  push:
    branches:
    - fpu-jit-x64-20261116
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/checkout@v4
      with:
        repository: PortMidi/portmidi
        ref: 8341a6713842d2374c3aad8998d43b20ad0db435
        path: build/portmidi
        fetch-depth: 1
    - uses: actions/checkout@v4
      with:
        repository: tonioni/WinUAE
        ref: d82bc2549f27943d11dc59482d5388daf1c0f337
        path: build/winuae
    - name: Build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bzip2 cmake libasound2-dev autoconf automake build-essential clang python3 meson ninja-build pkg-config libsdl2-dev libjpeg-dev libglib2.0-dev libudev-dev libusb-1.0-0-dev dpkg-dev
    - name: Pinned SLIRP runtime
      run: |
        mkdir -p build/dependency-source
        curl -L --fail --retry 3 -o build/dependency-source/libslirp-v4.9.1.tar.bz2 https://gitlab.freedesktop.org/slirp/libslirp/-/archive/v4.9.1/libslirp-v4.9.1.tar.bz2
        echo '3caff6e2de445f4995629d4929c55419f661b2b1d14f12481e155a71c1e8f811  build/dependency-source/libslirp-v4.9.1.tar.bz2' | sha256sum -c -
        tar -xjf build/dependency-source/libslirp-v4.9.1.tar.bz2 -C build
        meson setup build/slirp-build build/libslirp-v4.9.1 --prefix="$RUNNER_TEMP/slirp" --libdir=lib --buildtype=release
        ninja -C build/slirp-build
        ninja -C build/slirp-build install
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/slirp/lib/pkgconfig" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/slirp/lib" >> "$GITHUB_ENV"
    - name: Build exact modern040 CPU and SoftFloat source
      run: |
        python3 tools/build-modern040-library.py --output "$RUNNER_TEMP/modern040" --upstream build/winuae --cxx clang++
    - name: Build pinned PortMidi native device support
      run: |
        if test "${RUNNER_OS:-Linux}" = macOS; then
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi" --macos-min-version "${MACOSX_DEPLOYMENT_TARGET:-15.0}" --macos-architecture "$(uname -m)"
        else
          python3 tools/build-portmidi.py --source build/portmidi --build-dir "$RUNNER_TEMP/portmidi-build" --prefix "$RUNNER_TEMP/portmidi"
        fi
        echo "PKG_CONFIG_PATH=$RUNNER_TEMP/portmidi/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/portmidi/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
    - name: Build connected FPU JIT application
      run: |
        NO_CONFIGURE=1 ./autogen.sh
        mkdir -p build/fpu-linux
        cd build/fpu-linux
        ../../configure --enable-portmidi --prefix=/usr --datadir=/usr/share/aranym-unofficial --disable-opengl --enable-sdl2 --enable-jit-compiler --enable-jit-fpu --enable-addressing=normal --enable-modern040-core --with-modern040-profile=aranym-modern040-beta1 --with-modern040-library="$RUNNER_TEMP/modern040/libmodern040.a" --enable-slirp --enable-nfjpeg --enable-disasm=builtin --disable-flightrecorder --disable-fullhistory CFLAGS='-O3 -fno-pie' CXXFLAGS='-O3 -fno-pie' LDFLAGS='-no-pie -Wl,-rpath,/usr/lib/aranym-unofficial'
        grep -q -- '-DMODERN040_FPU_JIT' Makefile
        make -j3
    - name: Exact firmware and dependency sources
      run: |
        curl -L --fail --retry 3 -o build/dependency-source/emutos-source.tar.gz https://api.github.com/repos/emutos/emutos/tarball/e0f0c2333d39a487e73d8b17f62b70a95441cd32
        git -C build/winuae archive --format=tar.gz --prefix=winuae-d82bc254/ -o "$GITHUB_WORKSPACE/build/dependency-source/winuae-source.tar.gz" HEAD
    - name: Package application only
      run: |
        python3 tools/package-linux.py --portmidi-prefix "$RUNNER_TEMP/portmidi" --x64-fpu-jit --build-dir build/fpu-linux --slirp-library "$RUNNER_TEMP/slirp/lib/libslirp.so.0" --slirp-source-archive build/dependency-source/libslirp-v4.9.1.tar.bz2 --emutos-source-archive build/dependency-source/emutos-source.tar.gz --winuae-source-archive build/dependency-source/winuae-source.tar.gz --output build/fpu-package
    - name: Install packaged application and inspect runtime dependencies
      run: |
        sudo apt-get install -y ./build/fpu-package/aranym-1.2.0-unofficial-beta2-linux-amd64.deb
        python3 tools/check-macos-package.py --installed-linux --runtime --diagnostics build/fpu-package-checks
    - name: Archive package and corresponding source
      run: |
        tar -czf aranym-1.2.0-unofficial-beta2-linux-x86_64.tar.gz -C build/fpu-package --exclude=deb-root --exclude=debian .
    - uses: actions/upload-artifact@v4
      with:
        name: aranym-fpu-jit-linux-${{ github.sha }}
        path: |
          aranym-1.2.0-unofficial-beta2-linux-x86_64.tar.gz
          build/fpu-package/aranym-1.2.0-unofficial-beta2-linux-amd64.deb
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: fpu-jit-linux-diagnostics-${{ github.sha }}
        path: |
          build/fpu-linux/config.log
          build/fpu-package/build-manifest.json
          build/fpu-package-checks/
