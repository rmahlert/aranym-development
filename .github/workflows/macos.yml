name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ macos-13, macos-14 ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install autoconf automake libtool pkg-config sdl2 libslirp
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix libslirp)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          curl -L --fail --retry 3 -o /tmp/emutos-aranym.zip https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-aranym-1.4.zip
          unzip -q /tmp/emutos-aranym.zip -d /tmp/emutos-aranym
          cp /tmp/emutos-aranym/emutos-aranym-1.4/etos1024k.img data/emutos-aranym.img
          ./autogen.sh --disable-opengl --enable-slirp --disable-jit-compiler
          make -j2

      - name: Package artifact
        run: |
          mkdir -p package/ARAnyM.app
          cp aranym package/ARAnyM.app/
          cp COPYING README.md package/ARAnyM.app/
          cp doc/config package/ARAnyM.app/config.example
          cp data/emutos-aranym.img package/ARAnyM.app/
          cp data/wm_icon.bmp data/logo.bmp package/ARAnyM.app/
          tar -czf "aranym-${{ matrix.os }}.tar.gz" -C package ARAnyM.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aranym-${{ matrix.os }}
          path: aranym-${{ matrix.os }}.tar.gz
