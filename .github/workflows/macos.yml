name: macOS ARM64 validation

on:
  workflow_dispatch:
  push:
    branches: [main, macos-arm64-beta-20261115]
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    name: Native ARM64 emitter and JIT memory
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon
        run: |
          test "$(uname -m)" = arm64
          test "${{ runner.arch }}" = ARM64
          sw_vers
      - name: Execute and rewrite generated ARM64 code
        run: bash tests/arm64-platform/run.sh --require-native
      - name: Retain platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm64-platform-${{ github.sha }}
          path: build/arm64-platform/result.txt

  interpreter:
    name: Native ARM64 interpreter baseline (guest JIT pending)
    needs: platform
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config sdl2 jpeg-turbo
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix jpeg-turbo)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$(brew --prefix jpeg-turbo)/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$(brew --prefix jpeg-turbo)/lib -Wl,-headerpad_max_install_names" >> "$GITHUB_ENV"
      - name: Configure and build baseline
        run: |
          ./autogen.sh --disable-opengl --enable-sdl2 --disable-slirp --disable-jit-compiler --enable-addressing=normal
          grep -q -- '-DCPU_aarch64' src/Makefile
          make -j3
          lipo src/aranym -verify_arch arm64
      - name: Fetch matching official EmuTOS ROM and source
        run: |
          mkdir -p build/emutos
          curl -L --fail --retry 3 -o build/emutos/emutos-aranym-1.4.zip https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-aranym-1.4.zip
          curl -L --fail --retry 3 -o build/emutos/emutos-src-1.4.tar.gz https://downloads.sourceforge.net/project/emutos/emutos/1.4/emutos-src-1.4.tar.gz
      - name: Package relocated app with runtime dependencies
        run: >-
          python3 tools/package-macos.py --binary src/aranym --output build/macos-package
          --emutos-binary-archive build/emutos/emutos-aranym-1.4.zip
          --emutos-source-archive build/emutos/emutos-src-1.4.tar.gz
      - name: Check relocated package startup
        run: python3 tools/check-macos-package.py build/macos-package/ARAnyM-Unofficial.app
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-diagnostics-${{ github.sha }}
          path: |
            config.log
            build/macos-package/*.json
            build/macos-package/*.txt
      - name: Archive development artifact and exact source
        run: |
          git archive --format=tar.gz -o build/macos-package/aranym-source.tar.gz HEAD
          tar -czf aranym-unofficial-arm64-interpreter.tar.gz -C build/macos-package .
          shasum -a 256 aranym-unofficial-arm64-interpreter.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: aranym-unofficial-arm64-interpreter-${{ github.sha }}
          path: aranym-unofficial-arm64-interpreter.tar.gz
