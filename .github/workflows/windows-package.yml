name: Windows beta installer acceptance

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft prerelease containing the installer
        required: true
        default: v1.2.0-unofficial-beta1
      installer_sha256:
        description: Expected SHA-256 of the exact installer
        required: true
      candidate_url:
        description: Optional temporary GitHub asset download URL for a draft candidate
        required: false

permissions:
  contents: read

jobs:
  installed:
    name: Install, upgrade and exercise native Windows SLIRP
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SHA256: ${{ inputs.installer_sha256 }}
      CANDIDATE_URL: ${{ inputs.candidate_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify candidate installer
        shell: pwsh
        run: |
          if ($env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Expected SHA-256 is invalid' }
          if ($env:CANDIDATE_URL) {
            $url = [uri]$env:CANDIDATE_URL
            if ($url.Scheme -ne 'https' -or $url.Host -notin @('release-assets.githubusercontent.com', 'objects.githubusercontent.com')) { throw 'Candidate URL must be a GitHub release asset' }
            New-Item -ItemType Directory -Force build/windows-dist | Out-Null
            Invoke-WebRequest -Uri $url -OutFile build/windows-dist/aranym-1.2.0-unofficial-beta1-windows-x86_64-setup.exe
          } else {
            gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'aranym-1.2.0-unofficial-beta1-windows-x86_64-setup.exe' --dir build/windows-dist
            if ($LASTEXITCODE -ne 0) { throw 'Installer download failed' }
          }
          $installer = Get-Item build/windows-dist/*-setup.exe
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $env:EXPECTED_SHA256) { throw 'Installer checksum mismatch' }
      - name: Install on a clean Windows runner
        shell: pwsh
        run: |
          $installer = Get-Item build/windows-dist/*-setup.exe
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/D=C:\ARAnyMBetaTest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          if (-not (Test-Path C:\ARAnyMBetaTest\aranym.exe)) { throw 'Executable was not installed' }
          if (-not (Test-Path C:\ARAnyMBetaTest\ARAnyM-runtime-verification.txt)) { throw 'Runtime verification report is missing' }
          Get-Content C:\ARAnyMBetaTest\ARAnyM-runtime-verification.txt
      - name: Verify guest networking and receiver shutdown in installed app
        shell: pwsh
        run: |
          python tests/macos-slirp/run.py --windows-emulator C:/ARAnyMBetaTest/aranym.exe --firmware C:/ARAnyMBetaTest/aranym/emutos-aranym.img --output build/windows-evidence
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows SLIRP test failed' }
      - name: Verify upgrade preserves existing configuration and firmware
        shell: pwsh
        run: |
          $config = Join-Path $env:USERPROFILE 'aranym\config'
          $firmware = 'C:\ARAnyMBetaTest\aranym\emutos-aranym.img'
          $beforeConfig = (Get-FileHash $config -Algorithm SHA256).Hash
          $beforeFirmware = (Get-FileHash $firmware -Algorithm SHA256).Hash
          $installer = Get-Item build/windows-dist/*-setup.exe
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', '/D=C:\ARAnyMBetaTest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Upgrade exited $($process.ExitCode)" }
          if ((Get-FileHash $config -Algorithm SHA256).Hash -ne $beforeConfig) { throw 'Upgrade changed the user config' }
          if ((Get-FileHash $firmware -Algorithm SHA256).Hash -ne $beforeFirmware) { throw 'Upgrade changed existing firmware' }
          Copy-Item C:\ARAnyMBetaTest\ARAnyM-runtime-verification.txt build/windows-evidence/runtime-verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-beta1-${{ github.sha }}
          path: build/windows-evidence
